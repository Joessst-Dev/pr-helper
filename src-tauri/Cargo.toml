[package]
name = "pr-helper"
version = "0.5.1"
description = "Claude-powered PR reviewer for GitHub and GitLab"
authors = ["Jost Weyers"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pr_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tokio = { version = "1.54.1", features = ["full"] }
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
regex = "1.13.2"
async-trait = "0.1.92"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl", "chrono-impl", "no-serde-warnings", "serde-json-impl"] }
urlencoding = "2.1.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
tokio-util = "0.7.20"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

# A curated subset of the lints from the Rust best-practices skill (.claude/skills/rust-best-practices).
# CI runs clippy with `-D warnings`, so these fail the build.
[lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
map_unwrap_or = "warn"
format_push_string = "warn"
redundant_closure_for_method_calls = "warn"
allow_attributes_without_reason = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
manual_let_else = "warn"
single_match_else = "warn"
ignored_unit_patterns = "warn"
unnested_or_patterns = "warn"
semicolon_if_nothing_returned = "warn"
wildcard_imports = "warn"
default_trait_access = "warn"
format_collect = "warn"
cast_possible_truncation = "warn"
duration_suboptimal_units = "warn"
missing_panics_doc = "warn"
unused_async = "warn"
