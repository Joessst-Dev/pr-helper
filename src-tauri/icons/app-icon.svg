<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for all app icons. Regenerate with: npx tauri icon src-tauri/icons/app-icon.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c7cfa"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px body centred on the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- Pull request glyph -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="350" cy="316" r="62"/>
    <circle cx="350" cy="708" r="62"/>
    <line x1="350" y1="378" x2="350" y2="646"/>
    <circle cx="660" cy="708" r="62"/>
    <path d="M660 646 V440 a90 90 0 0 0 -90 -90 H472"/>
    <polyline points="540,282 472,350 540,418"/>
  </g>

  <!-- "Reviewed" check badge -->
  <circle cx="770" cy="256" r="104" fill="#2f9e44" stroke="#ffffff" stroke-width="22"/>
  <polyline points="724,258 756,290 816,228" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
