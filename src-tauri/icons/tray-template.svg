<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- macOS menu bar template icon: black + alpha only, macOS recolours it.
       Render: rsvg-convert -w 44 -h 44 tray-template.svg -o tray-template.png -->
  <defs>
    <!-- Cut a gap around the badge so it never touches the glyph. -->
    <mask id="gap">
      <rect width="22" height="22" fill="#fff"/>
      <circle cx="17.4" cy="4.6" r="4.9" fill="#000"/>
    </mask>
    <!-- Knock the check mark out of the badge. -->
    <mask id="check">
      <rect width="22" height="22" fill="#fff"/>
      <polyline points="15.6,4.7 16.9,6 19.3,3.4" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#gap)" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5.5" cy="5.5" r="2.1"/>
    <circle cx="5.5" cy="16.5" r="2.1"/>
    <line x1="5.5" y1="7.6" x2="5.5" y2="14.4"/>
    <circle cx="15.5" cy="16.5" r="2.1"/>
    <path d="M15.5 14.4 V11 a3.2 3.2 0 0 0 -3.2 -3.2 H9.4"/>
    <polyline points="11.3,5.9 9.4,7.8 11.3,9.7"/>
  </g>
  <circle cx="17.4" cy="4.6" r="3.7" fill="#000" mask="url(#check)"/>
</svg>
